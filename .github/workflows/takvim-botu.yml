name: Takvim botu

on:
  schedule:
    - cron: "*/10 * * * *"  # 10 dakikada bir (GitHub birkaç dakika geciktirebilir)
  workflow_dispatch:         # Actions sekmesinden "Run workflow" ile elle çalıştırma

permissions:
  contents: write            # şifreli durum.enc'i depoya geri kaydetmek için

concurrency:
  group: takvim-botu         # iki çalışma aynı anda olmasın
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Sıraya giren çalışmalar tetiklendikleri anki eski commit'i değil, dalın EN GÜNCEL halini
          # (önceki çalışmanın kaydettiği durum.enc dahil) alsın; yoksa aynı bildirimler tekrar gönderilir.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutuphaneleri kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          ODTU_KULLANICI: ${{ secrets.ODTU_KULLANICI }}
          ODTU_SIFRE: ${{ secrets.ODTU_SIFRE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DURUM_ANAHTARI: ${{ secrets.DURUM_ANAHTARI }}
          BOT_DEBUG: "0"   # sorun ararken "1" yap: günlüğe ayrıntılı teşhis satırları yazılır (herkese açık!)
        run: python bot.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "takvim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f durum.enc ] && git add durum.enc
          git rm --cached --ignore-unmatch -q durum.json   # şifresiz dosya asla depoya girmesin
          git diff --cached --quiet && exit 0
          git commit -m "durum guncellendi"
          # Bot çalışırken depoda dosya değiştirdiysen önce onları çek, sonra kaydet
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "::error::durum.enc kaydedilemedi"
          exit 1
